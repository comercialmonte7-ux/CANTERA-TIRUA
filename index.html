<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cantera Tirúa | Gestión de Áridos</title>
    <style>
      body { background-color: #fafafa; margin: 0; font-family: sans-serif; }
      #initial-loader {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        z-index: 9999; transition: opacity 0.5s ease;
      }
      .loader-mountain {
        width: 60px; height: 60px; border-bottom: 4px solid #d97706;
        border-right: 4px solid #d97706; transform: rotate(45deg);
        animation: pulse 2s infinite; margin-bottom: 24px;
      }
      .loader-text {
        font-size: 10px; font-weight: 800; color: #71717a;
        letter-spacing: 0.3em; text-transform: uppercase;
      }
      @keyframes pulse { 0% { opacity: 0.3; scale: 0.95; } 50% { opacity: 1; scale: 1; } 100% { opacity: 0.3; scale: 0.95; } }
    </style>
  </head>
  <body>
    <div id="initial-loader">
      <div class="loader-mountain"></div>
      <div class="loader-text">Cantera Tirúa</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
